version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: national_health_policy/Dockerfile.backend
    container_name: nhp-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./national_health_policy/data:/app/data
      - ./national_health_policy/models:/app/models

  frontend:
    build:
      context: .
      dockerfile: national_health_policy/Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: nhp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
